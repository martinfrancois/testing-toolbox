# pnpm does not run a dependency's install scripts unless it is listed here.
# The video reporter spawns the ffmpeg binary, and the install script of the
# matching platform package is the chmod that makes it executable, so every
# platform package the lockfile carries is listed and the demo records video
# wherever it is presented. The browser drivers download Edge and Firefox, which
# this demo never starts, and esbuild finds its own prebuilt binary without its
# postinstall.
allowBuilds:
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/darwin-x64': true
  '@ffmpeg-installer/linux-arm': true
  '@ffmpeg-installer/linux-arm64': true
  '@ffmpeg-installer/linux-ia32': true
  '@ffmpeg-installer/linux-x64': true
  '@ffmpeg-installer/win32-ia32': true
  '@ffmpeg-installer/win32-x64': true
  edgedriver: false
  esbuild: false
  geckodriver: false

# Keeps pnpm-lock.yaml a single YAML document. Without this, pnpm 12 and
# later start the lockfile with a document that pins only pnpm itself,
# GitHub's dependency graph reads only that first document, and Dependabot
# stops seeing every npm package. Remove this line once
# https://github.com/dependabot/dependabot-core/issues/15904 is fixed and the
# dependency graph lists the packages from the second document. The cost:
# pnpm no longer switches itself to the packageManager version in
# package.json. CI installs that version with pnpm/action-setup, and locally
# Corepack has to provide it.
pmOnFail: ignore
