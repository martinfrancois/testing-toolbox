# MockServer 9 logs a startup warning for each default that a later major release
# makes stricter. These lines adopt the stricter values now. MockServer then
# listens only on this machine, answers 404 to unmatched requests instead of
# proxying them, never forwards to private addresses, limits request line and
# header sizes, checks upstream certificates against the JVM trust store, and
# signs TLS with a CA it creates instead of the CA bundled in its jar.
mockserver.localBoundIP=127.0.0.1
mockserver.attemptToProxyIfNoMatchingExpectation=false
mockserver.forwardProxyBlockPrivateNetworks=true
mockserver.maxInitialLineLength=8192
mockserver.maxHeaderSize=16384
mockserver.maxChunkSize=16384
mockserver.forwardProxyTLSX509CertificatesTrustManagerType=JVM
mockserver.dynamicallyCreateCertificateAuthorityCertificate=true
mockserver.directoryToSaveDynamicSSLCertificate=build/mockserver
